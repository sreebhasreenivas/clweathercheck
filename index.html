<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather Check</title>
  <meta name="color-scheme" content="light dark">
  <script>
    // Set the theme before first paint to avoid a flash of the wrong theme.
    // theme.js reads the storage key from window.WC_THEME_KEY, so it is defined only here.
    window.WC_THEME_KEY = 'weathercheck-theme';
    (function () {
      var t = null;
      try { t = localStorage.getItem(window.WC_THEME_KEY); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="./" aria-label="Weather Check home">
        <span class="brand-icon" aria-hidden="true">⛅</span>
        <span class="brand-name">Weather Check</span>
      </a>

      <button id="theme-toggle" class="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Dark mode">
        <span class="toggle-track" aria-hidden="true">
          <span class="toggle-icon toggle-sun">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          </span>
          <span class="toggle-icon toggle-moon">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </span>
          <span class="toggle-thumb"></span>
        </span>
        <span class="toggle-label">Dark mode</span>
      </button>
    </div>
  </header>

  <main class="container">
    <form id="search-form" class="search" role="search" autocomplete="off">
      <label for="city" class="visually-hidden">City</label>
      <input id="city" name="city" type="search" placeholder="Search a city, e.g. Sydney" required>
      <button type="submit" class="btn-primary">Check weather</button>
    </form>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <section id="current" class="card current" hidden aria-labelledby="current-place">
      <div class="current-main">
        <div>
          <h1 id="current-place" class="place"></h1>
          <p id="current-desc" class="muted"></p>
        </div>
        <div class="current-temp">
          <span id="current-icon" class="wx-icon" aria-hidden="true"></span>
          <span id="current-temp-value" class="temp"></span>
        </div>
      </div>
      <dl class="stats">
        <div class="stat"><dt>Feels like</dt><dd id="stat-feels"></dd></div>
        <div class="stat"><dt>Humidity</dt><dd id="stat-humidity"></dd></div>
        <div class="stat"><dt>Wind</dt><dd id="stat-wind"></dd></div>
        <div class="stat"><dt>Rain chance</dt><dd id="stat-rain"></dd></div>
      </dl>
      <div class="wear">
        <h2 class="wear-title">What to wear</h2>
        <ul id="wear-list" class="wear-list"></ul>
      </div>
    </section>

    <section id="forecast-section" hidden aria-labelledby="forecast-heading">
      <h2 id="forecast-heading" class="section-title">5-day forecast</h2>
      <ol id="forecast" class="forecast"></ol>
    </section>

    <section id="empty" class="card empty">
      <span class="wx-icon" aria-hidden="true">🌤️</span>
      <p>Search for a city to see current conditions and the 5-day forecast.</p>
    </section>
  </main>

  <footer class="site-footer container">
    <p class="muted">Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></p>
  </footer>

  <script src="theme.js"></script>
  <script src="app.js"></script>
</body>
</html>
